<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boutique Pro | Inventory &amp; Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6EF; --cream-2:#F3EADF; --paper:#FFFFFF;
  --rose:#B76E79; --rose-2:#D9A5A0; --rose-soft:#F4E3E0;
  --burgundy:#6B1E3B; --burgundy-d:#4E1329;
  --navy:#121C34; --navy-2:#1C2845;
  --ink:#2A2430; --muted:#7A7084; --line:#E9DED2;
  --ok:#2F7D5B; --ok-bg:#E3F2EA;
  --warn:#B87714; --warn-bg:#FBF0D9;
  --bad:#B3342F; --bad-bg:#F9E2E0;
  --radius:16px;
  --shadow:0 1px 2px rgba(60,30,40,.05),0 6px 18px -10px rgba(60,30,40,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--cream);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:600;letter-spacing:.2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
small{color:var(--muted);font-size:12px}
.ic{width:20px;height:20px;flex:none}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:'tnum'}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:264px;position:fixed;inset:0 auto 0 0;z-index:40;display:flex;flex-direction:column;padding:26px 16px 18px;color:#D8D1DE;
  background:radial-gradient(120% 60% at 0% 0%,#24305a 0%,transparent 60%),linear-gradient(180deg,var(--navy) 0%,#0B1223 100%);transition:transform .3s ease}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 24px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:18px;color:var(--navy);
  background:linear-gradient(135deg,#F1CFC7,var(--rose) 60%,#9A5560);box-shadow:0 6px 16px -6px rgba(183,110,121,.7)}
.brand h1{font-size:19px;color:#fff;line-height:1.1}
.brand small{color:var(--rose-2);letter-spacing:1.4px;text-transform:uppercase;font-size:10px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:#BDB5C6;text-align:left;position:relative;transition:background .2s,color .2s,transform .2s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(3px)}
.nav-item.active{background:linear-gradient(90deg,rgba(183,110,121,.28),rgba(183,110,121,.06));color:#fff}
.nav-item.active::before{content:'';position:absolute;left:-16px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--rose)}
.nav-badge{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--rose);color:#fff;font-size:11.5px;font-weight:600;display:grid;place-items:center}
.nav-badge[hidden]{display:none}
.side-foot{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.05);font-size:12.5px;color:#BDB5C6}
.side-foot b{color:#fff;display:block;margin-bottom:2px;font-weight:600}
main{margin-left:264px;flex:1;min-width:0;padding:0 34px 56px}
.scrim{position:fixed;inset:0;background:rgba(18,28,52,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:35}

.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:20px 0 16px;background:rgba(251,246,239,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar .titles{flex:1;min-width:0}
.topbar h2{font-size:28px;line-height:1.15;color:var(--burgundy-d)}
.topbar p{color:var(--muted);font-size:13px}
.date-pill{padding:8px 14px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap}
.menu-btn{display:none;width:42px;height:42px;border-radius:12px;background:var(--paper);border:1px solid var(--line);place-items:center}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:500;color:#fff;background:linear-gradient(135deg,var(--burgundy),var(--burgundy-d));box-shadow:0 6px 16px -8px rgba(107,30,59,.7);transition:transform .2s,box-shadow .2s,filter .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 20px -8px rgba(107,30,59,.7);filter:brightness(1.08)}
.btn:active{transform:translateY(0)}
.btn .ic{width:17px;height:17px}
.btn-rose{background:linear-gradient(135deg,#C98A93,var(--rose));box-shadow:0 6px 16px -8px rgba(183,110,121,.9);color:#fff}
.btn-ghost{background:var(--paper);color:var(--burgundy);border:1px solid var(--line);box-shadow:none}
.btn-ghost:hover{background:var(--rose-soft);box-shadow:none}
.btn-danger{background:linear-gradient(135deg,#C4433D,var(--bad))}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:10px}
.ib{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);transition:background .2s,color .2s,transform .2s}
.ib:hover{background:var(--rose-soft);color:var(--burgundy);transform:scale(1.08)}
.ib.danger:hover{background:var(--bad-bg);color:var(--bad)}
.ib .ic{width:17px;height:17px}

/* ---------- Cards ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;transition:transform .25s,box-shadow .25s,border-color .25s}
.card h3{font-size:18px;color:var(--burgundy-d);margin-bottom:4px}
.card .sub-h{color:var(--muted);font-size:13px;margin-bottom:16px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:28px 30px;border-radius:20px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;
  background:radial-gradient(90% 140% at 100% 0%,rgba(217,165,160,.55),transparent 55%),linear-gradient(120deg,var(--burgundy-d),var(--burgundy) 60%,#8A2E50)}
.hero::after{content:'';position:absolute;right:-60px;bottom:-90px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 38px rgba(255,255,255,.04)}
.hero .eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:var(--rose-2)}
.hero h2{font-size:26px;margin:4px 0 6px}
.hero p{color:#EAD5DA;font-size:14px}
.hero .btn{position:relative;z-index:1}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:22px}
.stat{display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;position:relative;overflow:hidden;width:100%}
.stat:hover{transform:translateY(-5px);box-shadow:0 18px 34px -16px rgba(107,30,59,.35);border-color:var(--rose-2)}
.stat .chip{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;transition:transform .3s}
.stat:hover .chip{transform:rotate(-8deg) scale(1.08)}
.stat .lbl{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat .val{font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:600;color:var(--navy);line-height:1.2}
.stat .sub{font-size:12.5px;color:var(--muted)}
.t-rose .chip{background:var(--rose-soft);color:var(--rose)}
.t-burg .chip{background:#F0DCE3;color:var(--burgundy)}
.t-navy .chip{background:#DDE2F0;color:var(--navy-2)}
.t-warn .chip{background:var(--warn-bg);color:var(--warn)}
.t-bad .chip{background:var(--bad-bg);color:var(--bad)}
.t-ok .chip{background:var(--ok-bg);color:var(--ok)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-bottom:18px}
.cols.wide-left{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.cols>*,.cards>*,.mini>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:18px}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;margin:0 -6px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;min-width:560px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px;border-bottom:1px solid #F2E9DF;vertical-align:middle}
.tbl tbody tr{transition:background .2s}
.tbl tbody tr:hover{background:#FCF8F3}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl td b{display:block;font-weight:600}
.tbl .act{text-align:right;white-space:nowrap}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.low{background:var(--warn-bg);color:var(--warn)}
.badge.out{background:var(--bad-bg);color:var(--bad)}
.badge.in{background:var(--ok-bg);color:var(--ok)}
.badge.role{background:var(--rose-soft);color:var(--burgundy)}

/* ---------- Forms ---------- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .grow{flex:1;min-width:200px}
.field-wrap{position:relative}
.field-wrap .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px}
.field-wrap input{padding-left:40px}
input,select{width:100%;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:#FFFDFB;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{border-color:var(--rose);box-shadow:0 0 0 4px rgba(183,110,121,.16)}
input[readonly],input:disabled{background:var(--cream-2);color:var(--muted)}
.toolbar select{width:auto;min-width:150px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld.full{grid-column:1/-1}
.fld span{font-size:12.5px;font-weight:500;color:var(--burgundy-d)}
.fld em{font-style:normal;font-size:11.5px;color:var(--muted)}
.form-error{margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-size:13px}
.form-error[hidden]{display:none}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:#FFFDFB;font-weight:500;color:var(--muted);transition:all .2s}
.seg input:checked+span{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
.preview{margin-top:16px;padding:16px;border-radius:14px;background:var(--cream);border:1px dashed var(--rose-2)}
.preview div{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.preview div.total{color:var(--burgundy-d);font-weight:600;font-size:17px;border-top:1px solid var(--line);margin-top:6px;padding-top:9px}

/* ---------- Charts & meters ---------- */
.bars{display:flex;align-items:flex-end;gap:12px;height:190px;padding-top:6px}
.bars .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px}
.bars .col .b{width:100%;max-width:42px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--rose),var(--burgundy));min-height:4px;transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transition:filter .2s}
.bars .col:hover .b{filter:brightness(1.15)}
.bars .col small{font-size:11.5px}
.bars .col .amt{font-size:11px;color:var(--ink);font-weight:500}
.hbar{display:grid;grid-template-columns:96px 1fr 52px;gap:12px;align-items:center;padding:7px 0;font-size:13.5px}
.hbar .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:8px;background:var(--cream-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--burgundy));transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
.bar.warn>i{background:linear-gradient(90deg,#E3B057,var(--warn))}
.bar.bad>i{background:var(--bad)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.view-enter{animation:fadeUp .45s ease both}

/* ---------- Alerts ---------- */
.alert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.alert-card{display:flex;flex-direction:column;gap:12px}
.alert-card:hover{transform:translateY(-4px);box-shadow:0 16px 30px -16px rgba(107,30,59,.3)}
.alert-card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.alert-card .top b{display:block}
.alert-card .meter{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.alert-card .row{display:flex;gap:8px;flex-wrap:wrap}
.section-h{display:flex;align-items:center;gap:10px;margin:26px 0 14px}
.section-h h3{font-size:20px;color:var(--burgundy-d)}
.count-pill{padding:2px 11px;border-radius:99px;background:var(--rose-soft);color:var(--burgundy);font-size:12.5px;font-weight:600}
.good{display:flex;flex-direction:column;align-items:center;gap:8px;padding:34px;color:var(--ok);text-align:center}
.good .ic{width:34px;height:34px}

/* ---------- Roles / small ---------- */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip-s{padding:8px 14px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:13px;transition:transform .2s,border-color .2s}
.chip-s:hover{transform:translateY(-2px);border-color:var(--rose-2)}
.chip-s b{color:var(--burgundy);margin-left:4px}
.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;margin-right:10px;vertical-align:middle;background:linear-gradient(135deg,var(--rose-soft),var(--rose-2));color:var(--burgundy-d);font-weight:600;font-size:13px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.mini .card{padding:16px 18px}
.mini .card:hover{transform:translateY(-3px)}
.mini small{text-transform:uppercase;letter-spacing:1px}
.mini b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:22px;color:var(--navy);font-weight:600}
.notice{display:flex;gap:10px;padding:12px 16px;border-radius:14px;background:var(--rose-soft);color:var(--burgundy-d);font-size:13px;margin-bottom:20px}
.notice .ic{width:18px;height:18px;margin-top:1px}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #F2E9DF;transition:padding .2s}
.list-row:last-child{border-bottom:0}
.list-row:hover{padding-left:6px}
.list-row .grow{flex:1;min-width:0}
.list-row .grow b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.setting-block{max-width:720px}
.danger-zone{border-color:#EBC9C6;margin-top:18px}

/* ---------- Modal, toast, bill ---------- */
.modal-wrap{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(18,28,52,.55);backdrop-filter:blur(3px)}
.modal-wrap.open{display:flex}
.modal{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:20px;padding:26px;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:pop .3s ease both}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-head h3{font-size:22px;color:var(--burgundy-d)}
.toasts{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{padding:13px 18px;border-radius:14px;background:var(--navy);color:#fff;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);border-left:4px solid var(--rose);animation:pop .3s ease both;max-width:340px;font-size:13.5px}
.toast.error{border-left-color:#E0645E}
.toast.ok{border-left-color:#4FB08A}
.bill{border:1px dashed var(--rose-2);border-radius:14px;padding:24px;background:#FFFDFB}
.bill-head{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.bill-head .logo{margin:0 auto 10px}
.bill-head h3{font-size:22px;color:var(--burgundy-d)}
.bill-head p{color:var(--muted);font-size:12.5px}
.bill-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:13px;margin-bottom:14px}
.bill-meta dt{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:1px}
.bill-meta dd{font-weight:500;margin-bottom:6px}
.bill-line{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.bill-line.total{border-top:2px solid var(--burgundy);margin-top:8px;padding-top:10px;font-weight:700;font-size:18px;color:var(--burgundy-d)}
.bill-foot{text-align:center;margin-top:18px;color:var(--muted);font-size:12.5px}

/* ---------- Responsive ---------- */
@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.cols,.cols.wide-left{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%)}
  body.menu-open .sidebar{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.4)}
  body.menu-open .scrim{opacity:1;pointer-events:auto}
  main{margin-left:0;padding:0 18px 44px}
  .menu-btn{display:grid}
  .date-pill{display:none}
  .topbar h2{font-size:23px}
}
@media (max-width:600px){
  .cards,.mini,.g2{grid-template-columns:minmax(0,1fr)}
  .hero{padding:22px}
  .hbar{grid-template-columns:78px 1fr 40px}
  .toasts{left:14px;right:14px}
  .toast{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Print ---------- */
@media print{
  .sidebar,.topbar,.scrim,.toasts,.no-print,.notice,.toolbar{display:none!important}
  main{margin:0;padding:0}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
  body.printing-bill .app{display:none}
  body.printing-bill .modal-wrap{position:static;display:block;background:none;padding:0;backdrop-filter:none}
  body.printing-bill .modal{box-shadow:none;padding:0;animation:none;max-height:none}
  body.printing-bill .modal-head{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">BP</div>
      <div><h1>Boutique Pro</h1><small id="brandStore">Rosewood Boutique</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><b>Demo mode</b>Sample data lives in this page only. Refreshing resets it.</div>
  </aside>
  <div class="scrim" data-action="closeMenu"></div>

  <main>
    <header class="topbar">
      <button class="menu-btn" data-action="toggleMenu" aria-label="Open menu" id="menuBtn"></button>
      <div class="titles"><h2 id="pageTitle">Overview</h2><p id="pageSub"></p></div>
      <span class="date-pill" id="todayPill"></span>
      <button class="btn btn-rose no-print" data-action="goto" data-id="sales" id="quickSale"></button>
    </header>
    <div id="view" class="view-enter"></div>
  </main>
</div>

<div class="modal-wrap" id="modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="ib no-print" data-action="closeModal" aria-label="Close" id="modalClose"></button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     Icons
     ===================================================================== */
  var ICONS = {
    grid: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

  var CATEGORIES_GENDER = ['Men', 'Women', 'Kids'];
  var TYPES = ['Ready-made', 'Fabric', 'Accessories'];

  var S = null;

  function P(id, name, cat, gender, type, size, colour, price, qty, min) {
    return { id: id, name: name, category: cat, gender: gender, type: type, size: size, colour: colour, price: price, qty: qty, min: min };
  }

  function pad(n) { return (n < 10 ? '00' : n < 100 ? '0' : '') + n; }

  function seedDate(daysAgo, hour, minute) {
    var t = new Date();
    t.setDate(t.getDate() - daysAgo);
    t.setHours(hour, minute, 0, 0);
    if (t.getTime() > Date.now()) {
      seedTick++;
      t = new Date(Date.now() - seedTick * 11 * 60000);
    }
    return t;
  }

  function seed() {
    seedTick = 0;
    S = {
      settings: { name: 'Rosewood Boutique', currency: '₹', defaultMin: 5, tax: 0 },
      products: [
        P('P001', 'Kanjivaram Silk Saree', 'Saree', 'Women', 'Ready-made', 'Free', 'Maroon', 8500, 12, 4),
        P('P002', 'Cotton Printed Kurti', 'Kurti', 'Women', 'Ready-made', 'M', 'Teal', 749, 3, 5),
        P('P003', 'Linen Formal Shirt', 'Shirt', 'Men', 'Ready-made', 'L', 'White', 1299, 20, 6),
        P('P004', 'Party Wear Dress', 'Dress', 'Women', 'Ready-made', 'S', 'Navy', 2499, 0, 3),
        P('P005', 'Pure Cotton Fabric (per m)', 'Fabric', 'Women', 'Fabric', 'NA', 'Cream', 320, 85, 20),
        P('P006', 'Kids Party Frock', 'Frock', 'Kids', 'Ready-made', '6Y', 'Pink', 899, 9, 4),
        P('P007', 'Pearl Necklace Set', 'Jewellery', 'Women', 'Accessories', 'NA', 'Ivory', 650, 2, 5),
        P('P008', 'Leather Belt', 'Belt', 'Men', 'Accessories', '34', 'Brown', 499, 15, 5),
        P('P009', 'Banarasi Silk Saree', 'Saree', 'Women', 'Ready-made', 'Free', 'Emerald', 6200, 7, 3),
        P('P010', 'Anarkali Kurti', 'Kurti', 'Women', 'Ready-made', 'L', 'Rose', 1599, 6, 4),
        P('P011', 'Handloom Cotton Fabric (per m)', 'Fabric', 'Women', 'Fabric', 'NA', 'Indigo', 280, 40, 15),
        P('P012', 'Silk Scarf', 'Scarf', 'Women', 'Accessories', 'NA', 'Gold', 450, 18, 6)
      ],
      employees: [
        { id: 'E001', name: 'Meera Nair', role: 'Manager' },
        { id: 'E002', name: 'Arjun Rao', role: 'Salesperson' },
        { id: 'E003', name: 'Sana Iqbal', role: 'Designer' },
        { id: 'E004', name: 'Kavita Joshi', role: 'Accountant' },
        { id: 'E005', name: 'Ramesh Patil', role: 'Tailor' }
      ],
      sales: [], txns: [], saleNo: 0, txnNo: 0
    };
    // History in chronological order. Stock quantities above are already "current".
    var events = [
      ['in', 8, 10, 'P001', 6], ['in', 8, 11, 'P005', 40], ['in', 7, 10, 'P003', 10],
      ['sale', 6, 12, 'P003', 2, 'Neha S.'], ['sale', 5, 15, 'P001', 1, 'Priya M.'],
      ['sale', 4, 11, 'P006', 3, 'R. Kulkarni'], ['in', 3, 10, 'P002', 8],
      ['sale', 3, 16, 'P005', 10, 'Tailor Hub'], ['sale', 2, 13, 'P002', 4, 'Divya R.'],
      ['sale', 1, 12, 'P008', 2, 'Karan T.'], ['sale', 1, 17, 'P004', 1, 'Ananya K.'],
      ['sale', 0, 9, 'P001', 1, 'Lakshmi V.'], ['sale', 0, 10, 'P010', 2, 'Sunita P.'], ['sale', 0, 11, 'P002', 1, 'Fatima A.']
    ];
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      var when = seedDate(e[1], e[2], 0);
      if (e[0] === 'in') {
        pushTxn(e[3], 'STOCK-IN', e[4], when);
      } else {
        var p = byId(e[3]);
        pushTxn(p.id, 'STOCK-OUT', e[4], when);
        pushSale(p, e[4], e[5], 'E002', e[5].length % 2 ? 'UPI' : 'Cash', when);
      }
    }
  }

  function pushTxn(pid, type, qty, when) {
    var t = { id: 'T' + pad(++S.txnNo), pid: pid, type: type, qty: qty, date: when || new Date() };
    S.txns.push(t);
    return t;
  }
  function pushSale(p, qty, customer, empId, pay, when) {
    var subtotal = p.price * qty;
    var tax = subtotal * (S.settings.tax / 100);
    var s = { id: 'S' + pad(++S.saleNo), pid: p.id, name: p.name, qty: qty, price: p.price, subtotal: subtotal, tax: tax,
      taxRate: S.settings.tax, total: subtotal + tax, customer: customer, emp: empId, pay: pay, date: when || new Date() };
    S.sales.push(s);
    return s;
  }

  /* =====================================================================
     Helpers
     ===================================================================== */
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function money(n) {
    return S.settings.currency + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function byId(id) {
    for (var i = 0; i < S.products.length; i++) { if (S.products[i].id === id) { return S.products[i]; } }
    return null;
  }
  function empById(id) {
    for (var i = 0; i < S.employees.length; i++) { if (S.employees[i].id === id) { return S.employees[i]; } }
    return null;
  }
  function saleById(id) {
    for (var i = 0; i < S.sales.length; i++) { if (S.sales[i].id === id) { return S.sales[i]; } }
    return null;
  }
  function status(p) { return p.qty === 0 ? 'out' : (p.qty <= p.min ? 'low' : 'ok'); }
  function statusLabel(p) { return { ok: 'In stock', low: 'Low stock', out: 'Out of stock' }[status(p)]; }
  function badge(p) { return '<span class="badge ' + status(p) + '">' + statusLabel(p) + '</span>'; }
  function isToday(d) {
    var n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }
  function fmtDT(d) {
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' }) + ', ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }
  function newestFirst(arr) { return arr.slice().sort(function (a, b) { return b.date - a.date; }); }
  function initials(name) {
    var parts = name.split(/\s+/);
    return (parts[0].charAt(0) + (parts.length > 1 ? parts[parts.length - 1].charAt(0) : '')).toUpperCase();
  }

  function stats() {
    var st = { products: S.products.length, units: 0, value: 0, low: 0, out: 0, today: 0, todayCount: 0, revenue: 0, unitsSold: 0 };
    S.products.forEach(function (p) {
      st.units += p.qty; st.value += p.qty * p.price;
      if (status(p) === 'low') { st.low++; } else if (status(p) === 'out') { st.out++; }
    });
    S.sales.forEach(function (s) {
      st.revenue += s.total; st.unitsSold += s.qty;
      if (isToday(s.date)) { st.today += s.total; st.todayCount++; }
    });
    return st;
  }

  function table(heads, rows, emptyMsg) {
    if (!rows.length) { return '<div class="empty">' + (emptyMsg || 'Nothing to show yet.') + '</div>'; }
    var nums = heads.map(function (h) { return h.charAt(0) === '#'; });
    var h = '<div class="tbl-wrap"><table class="tbl"><thead><tr>';
    heads.forEach(function (x, i) { h += '<th' + (nums[i] ? ' class="num"' : '') + '>' + esc(x.replace(/^#/, '')) + '</th>'; });
    h += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      h += '<tr>';
      r.forEach(function (c, i) { h += '<td' + (nums[i] ? ' class="num"' : '') + '>' + c + '</td>'; });
      h += '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function field(label, input, full, hint) {
    return '<label class="fld' + (full ? ' full' : '') + '"><span>' + label + '</span>' + input + (hint ? '<em>' + hint + '</em>' : '') + '</label>';
  }
  function select(name, options, selected) {
    var h = '<select name="' + name + '">';
    options.forEach(function (o) {
      var v = typeof o === 'string' ? o : o[0];
      var l = typeof o === 'string' ? o : o[1];
      h += '<option value="' + esc(v) + '"' + (v === selected ? ' selected' : '') + '>' + esc(l) + '</option>';
    });
    return h + '</select>';
  }
  function productOptions(filterFn, selected) {
    var list = S.products.filter(filterFn || function () { return true; }).map(function (p) {
      return [p.id, p.id + ' · ' + p.name + ' (' + p.qty + ' in stock)'];
    });
    return list;
  }
  function val(f, name) { return f.elements[name] ? f.elements[name].value.trim() : ''; }
  function formError(f, msg) {
    var box = f.querySelector('.form-error');
    if (box) { box.textContent = msg; box.hidden = false; }
    toast(msg, 'error');
    return false;
  }
  function clearError(f) { var b = f.querySelector('.form-error'); if (b) { b.hidden = true; } }
  function isInt(s) { return /^\d+$/.test(s); }
  function isNum(s) { return s !== '' && isFinite(Number(s)); }

  function toast(msg, kind) {
    var t = document.createElement('div');
    t.className = 'toast ' + (kind || '');
    t.textContent = msg;
    $('toasts').appendChild(t);
    setTimeout(function () { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 320); }, 3200);
  }

  function openModal(title, html) {
    $('modalTitle').textContent = title;
    $('modalBody').innerHTML = html;
    $('modal').classList.add('open');
    $('modal').setAttribute('aria-hidden', 'false');
    var first = $('modalBody').querySelector('input:not([type=hidden]):not([readonly]):not([disabled]),select');
    if (first && first.type !== 'radio') { setTimeout(function () { first.focus(); }, 60); }
  }
  function closeModal() {
    $('modal').classList.remove('open');
    $('modal').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('printing-bill');
    confirmCb = null;
  }
  function ask(title, msgHtml, okLabel, cb) {
    confirmCb = cb;
    openModal(title, '<p>' + msgHtml + '</p><div class="actions"><button class="btn btn-ghost" data-action="closeModal">Cancel</button><button class="btn btn-danger" data-action="confirmYes">' + okLabel + '</button></div>');
  }

  /* =====================================================================
     Views
     ===================================================================== */
  function statCard(label, value, sub, icon, tone, nav, isMoney) {
    return '<button class="card stat t-' + tone + '" data-nav="' + nav + '"><span class="chip">' + ic(icon) + '</span><span class="lbl">' + label +
      '</span><span class="val count" data-to="' + value + '"' + (isMoney ? ' data-money="1"' : '') + '>' + (isMoney ? money(value) : value.toLocaleString('en-IN')) +
      '</span><span class="sub">' + sub + '</span></button>';
  }

  function greeting() {
    var h = new Date().getHours();
    return h < 12 ? 'Good morning' : (h < 17 ? 'Good afternoon' : 'Good evening');
  }

  function viewOverview() {
    var st = stats();
    var h = '<div class="hero"><div><p class="eyebrow">' + greeting() + '</p><h2>Welcome back to ' + esc(S.settings.name) + '</h2><p>' +
      (st.low + st.out) + ' item(s) need attention &middot; ' + st.todayCount + ' sale(s) today</p></div>' +
      '<button class="btn btn-rose" data-action="goto" data-id="sales">' + ic('plus') + ' Create a bill</button></div>';

    h += '<div class="cards">' +
      statCard('Total Products', st.products, 'Across all categories', 'tag', 'burg', 'products') +
      statCard('Available Stock', st.units, 'Units on the shelves', 'box', 'navy', 'stock') +
      statCard('Low Stock', st.low, 'At or below minimum level', 'alert', 'warn', 'alerts') +
      statCard('Out of Stock', st.out, 'Needs restocking now', 'block', 'bad', 'alerts') +
      statCard('Today’s Sales', st.today, st.todayCount + ' bill(s) today', 'receipt', 'ok', 'sales', true) +
      statCard('Total Inventory Value', st.value, 'At selling price', 'coin', 'rose', 'reports', true) + '</div>';

    // Sales last 7 days
    var days = [], max = 1, i;
    for (i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var total = 0;
      for (var k = 0; k < S.sales.length; k++) {
        var sd = S.sales[k].date;
        if (sd.getFullYear() === d.getFullYear() && sd.getMonth() === d.getMonth() && sd.getDate() === d.getDate()) { total += S.sales[k].total; }
      }
      days.push({ label: d.toLocaleDateString('en-IN', { weekday: 'short' }), total: total });
      if (total > max) { max = total; }
    }
    var bars = '<div class="bars">';
    days.forEach(function (x) {
      bars += '<div class="col" title="' + esc(x.label) + ': ' + money(x.total) + '"><span class="amt">' + (x.total ? S.settings.currency + Math.round(x.total).toLocaleString('en-IN') : '') +
        '</span><div class="b" style="height:' + Math.max(2, Math.round(x.total / max * 100) * 0.78) + '%"></div><small>' + x.label + '</small></div>';
    });
    bars += '</div>';

    // Stock by category
    var cats = {}, catMax = 1;
    S.products.forEach(function (p) { cats[p.category] = (cats[p.category] || 0) + p.qty; });
    var catKeys = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; });
    catKeys.forEach(function (c) { if (cats[c] > catMax) { catMax = cats[c]; } });
    var catHtml = catKeys.length ? '' : '<div class="empty">No products yet.</div>';
    catKeys.slice(0, 7).forEach(function (c) {
      catHtml += '<div class="hbar"><span>' + esc(c) + '</span><div class="bar"><i style="width:' + Math.round(cats[c] / catMax * 100) + '%"></i></div><span class="num">' + cats[c] + '</span></div>';
    });

    h += '<div class="cols wide-left"><div class="card"><h3>Sales – last 7 days</h3><p class="sub-h">Daily billing totals</p>' + bars + '</div>' +
      '<div class="card"><h3>Stock by category</h3><p class="sub-h">Units available</p>' + catHtml + '</div></div>';

    // Attention + recent sales
    var need = S.products.filter(function (p) { return status(p) !== 'ok'; }).sort(function (a, b) { return a.qty - b.qty; }).slice(0, 6);
    var needHtml = need.length ? '' : '<div class="good">' + ic('check') + 'Everything is well stocked.</div>';
    need.forEach(function (p) {
      needHtml += '<div class="list-row"><div class="grow"><b>' + esc(p.name) + '</b><small>' + p.qty + ' left · minimum ' + p.min + '</small></div>' + badge(p) +
        '<button class="btn btn-sm btn-ghost" data-action="restock" data-id="' + p.id + '">Restock</button></div>';
    });
    var recent = newestFirst(S.sales).slice(0, 5);
    var recHtml = recent.length ? '' : '<div class="empty">No sales yet.</div>';
    recent.forEach(function (s) {
      recHtml += '<div class="list-row"><div class="grow"><b>' + esc(s.name) + '</b><small>' + esc(s.customer) + ' · ' + fmtDT(s.date) + '</small></div><b class="mono">' + money(s.total) + '</b></div>';
    });
    h += '<div class="cols"><div class="card"><h3>Needs attention</h3><p class="sub-h">Low and out-of-stock items</p>' + needHtml + '</div>' +
      '<div class="card"><h3>Recent sales</h3><p class="sub-h">Latest five bills</p>' + recHtml + '</div></div>';
    return h;
  }

  function productRows() {
    var q = ui.q.toLowerCase();
    var list = S.products.filter(function (p) {
      var hit = !q || (p.id + ' ' + p.name + ' ' + p.category + ' ' + p.colour).toLowerCase().indexOf(q) >= 0;
      return hit && (ui.type === 'all' || p.type === ui.type) && (ui.status === 'all' || status(p) === ui.status);
    });
    return table(['ID', 'Product', 'Type', 'Size / Colour', '#Price', '#Qty', '#Min', 'Status', ''], list.map(function (p) {
      return ['<span class="mono">' + esc(p.id) + '</span>', '<b>' + esc(p.name) + '</b><small>' + esc(p.category) + ' · ' + esc(p.gender) + '</small>', esc(p.type),
        esc(p.size) + ' · ' + esc(p.colour), money(p.price), p.qty, p.min, badge(p),
        '<span class="act"><button class="ib" title="Edit" aria-label="Edit ' + esc(p.name) + '" data-action="editProduct" data-id="' + p.id + '">' + ic('edit') + '</button>' +
        '<button class="ib danger" title="Delete" aria-label="Delete ' + esc(p.name) + '" data-action="deleteProduct" data-id="' + p.id + '">' + ic('trash') + '</button></span>'];
    }), 'No products match your filters.');
  }

  function viewProducts() {
    function opt(v, l, cur) { return '<option value="' + v + '"' + (cur === v ? ' selected' : '') + '>' + l + '</option>'; }
    return '<div class="card"><div class="toolbar"><div class="field-wrap grow">' + ic('search') +
      '<input id="pq" type="search" placeholder="Search by ID, name, category or colour" value="' + esc(ui.q) + '" autocomplete="off"></div>' +
      '<select id="ptype" aria-label="Filter by type">' + opt('all', 'All types', ui.type) + TYPES.map(function (t) { return opt(t, t, ui.type); }).join('') + '</select>' +
      '<select id="pstatus" aria-label="Filter by status">' + opt('all', 'All status', ui.status) + opt('ok', 'In stock', ui.status) + opt('low', 'Low stock', ui.status) + opt('out', 'Out of stock', ui.status) + '</select>' +
      '<button class="btn" data-action="addProduct">' + ic('plus') + ' Add product</button></div>' +
      '<div id="ptable">' + productRows() + '</div></div>';
  }

  function productFormHtml(p) {
    var edit = !!p;
    p = p || { id: '', name: '', category: '', gender: 'Women', type: 'Ready-made', size: '', colour: '', price: '', qty: '', min: S.settings.defaultMin };
    return '<form data-form="product" novalidate><input type="hidden" name="mode" value="' + (edit ? 'edit' : 'add') + '"><div class="g2">' +
      field('Product ID', '<input name="id" value="' + esc(p.id) + '" ' + (edit ? 'readonly' : 'placeholder="e.g. P013"') + '>') +
      field('Product name', '<input name="name" value="' + esc(p.name) + '" placeholder="e.g. Chanderi Silk Saree">') +

  function go(view) {
    ui.view = view;

  function animateCounts() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }
    var els = document.querySelectorAll('.count');
    Array.prototype.forEach.call(els, function (el) {
      var to = parseFloat(el.getAttribute('data-to')), isMoney = el.getAttribute('data-money'), start = null;
      function tick(ts) {
        if (start === null) { start = ts; }
        var p = Math.min(1, (ts - start) / 750), e = 1 - Math.pow(1 - p, 3), v = to * e;
        el.textContent = isMoney ? money(v) : Math.round(v).toLocaleString('en-IN');
        if (p < 1) { requestAnimationFrame(tick); }
      }
      requestAnimationFrame(tick);
    });
  }

  function updatePreview() {
    var f = $('saleForm'), box = $('salePreview');
    if (!f || !box) { return; }
    var p = byId(val(f, 'pid')), q = parseInt(val(f, 'qty'), 10);
    if (!p || !(q > 0)) { box.innerHTML = '<div><span>Enter a quantity to see the total</span></div>'; return; }
    var sub = p.price * q, tax = sub * S.settings.tax / 100;
    box.innerHTML = '<div><span>' + esc(p.name) + ' × ' + q + '</span><span>' + money(sub) + '</span></div>' +
      (S.settings.tax > 0 ? '<div><span>Tax (' + S.settings.tax + '%)</span><span>' + money(tax) + '</span></div>' : '') +
      '<div class="total"><span>Total</span><span>' + money(sub + tax) + '</span></div>' +
      (q > p.qty ? '<div style="color:var(--bad)"><span>Only ' + p.qty + ' available</span></div>' : '');
  }

  function csvCell(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
  function download(name, rows) {
    var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 150);
    toast('Downloaded ' + name, 'ok');
  }

  var FORMS = {
    product: function (f) {
      var mode = val(f, 'mode'), id = val(f, 'id'), name = val(f, 'name'), category = val(f, 'category'), gender = val(f, 'gender'), type = val(f, 'type'),
        size = val(f, 'size'), colour = val(f, 'colour'), price = val(f, 'price'), min = val(f, 'min'), qty = val(f, 'qty');
      if (!id || !name || !category || !size || !colour) { return formError(f, 'Please fill in every field.'); }
      if (mode === 'add' && byId(id)) { return formError(f, 'A product with ID ' + id + ' already exists.'); }
      if (!isNum(price)) { return formError(f, 'Enter a valid price.'); }
      if (Number(price) < 0) { return formError(f, 'Price cannot be negative.'); }
      if (!isInt(min)) { return formError(f, 'Minimum stock must be a whole number of 0 or more.'); }
      if (mode === 'add' && !isInt(qty)) { return formError(f, 'Quantity must be a whole number of 0 or more.'); }
      if (mode === 'add') {
        var p = P(id, name, category, gender, type, size, colour, Number(price), parseInt(qty, 10), parseInt(min, 10));
        S.products.push(p);
        if (p.qty > 0) { pushTxn(p.id, 'STOCK-IN', p.qty); }
        toast('Added ' + name + ' (' + statusLabel(p) + ')', 'ok');
      } else {
        var e = byId(id);
        e.name = name; e.category = category; e.gender = gender; e.type = type; e.size = size; e.colour = colour; e.price = Number(price); e.min = parseInt(min, 10);
        toast('Updated ' + name, 'ok');
      }
      closeModal(); render();
    },
    stock: function (f) {
      var p = byId(val(f, 'pid')), qs = val(f, 'qty'), kind = f.elements.kind.value;
      if (!p) { return formError(f, 'Please choose a product.'); }
      if (!isInt(qs) || parseInt(qs, 10) === 0) { return formError(f, 'Quantity must be a whole number greater than zero.'); }
      var q = parseInt(qs, 10);
      if (kind === 'out' && q > p.qty) { return formError(f, 'Cannot remove ' + q + '. Only ' + p.qty + ' available.'); }
      p.qty += kind === 'in' ? q : -q;
      pushTxn(p.id, kind === 'in' ? 'STOCK-IN' : 'STOCK-OUT', q);
      toast((kind === 'in' ? 'Added ' : 'Removed ') + q + ' · remaining ' + p.qty + ' (' + statusLabel(p) + ')', 'ok');
      render();
    },
    restock: function (f) {
      var p = byId(val(f, 'pid')), qs = val(f, 'qty');
      if (!p) { return formError(f, 'Product not found.'); }
      if (!isInt(qs) || parseInt(qs, 10) === 0) { return formError(f, 'Quantity must be a whole number greater than zero.'); }
      p.qty += parseInt(qs, 10);
      pushTxn(p.id, 'STOCK-IN', parseInt(qs, 10));
      toast(p.name + ' restocked · now ' + p.qty + ' (' + statusLabel(p) + ')', 'ok');
      closeModal(); render();
    },
    setmin: function (f) {
      var p = byId(val(f, 'pid')), m = val(f, 'min');
      if (!p) { return formError(f, 'Product not found.'); }
      if (!isInt(m)) { return formError(f, 'Minimum must be a whole number of 0 or more.'); }
      p.min = parseInt(m, 10);
      toast('Minimum level for ' + p.name + ' set to ' + p.min, 'ok');
      closeModal(); render();
    },
    sale: function (f) {
      var p = byId(val(f, 'pid')), qs = val(f, 'qty'), customer = val(f, 'customer');
      if (!p) { return formError(f, 'Please choose a product.'); }
      if (!isInt(qs) || parseInt(qs, 10) === 0) { return formError(f, 'Quantity must be a whole number greater than zero.'); }
      var q = parseInt(qs, 10);
      if (q > p.qty) { return formError(f, 'Only ' + p.qty + ' unit(s) of ' + p.name + ' available.'); }
      if (!customer) { return formError(f, 'Please enter the customer name.'); }
      p.qty -= q;
      pushTxn(p.id, 'STOCK-OUT', q);
      var s = pushSale(p, q, customer, val(f, 'emp'), val(f, 'pay'));
      render();
      openModal('Bill ' + s.id, billHtml(s));
      toast('Sale recorded. ' + p.name + ' now has ' + p.qty + ' left.', 'ok');
    },
    employee: function (f) {
      var id = val(f, 'id'), name = val(f, 'name'), role = val(f, 'role');
      if (!id || !name) { return formError(f, 'Please enter both an ID and a name.'); }
      if (empById(id)) { return formError(f, 'An employee with ID ' + id + ' already exists.'); }
      if (ROLES.indexOf(role) < 0) { return formError(f, 'Please choose a valid role.'); }
      S.employees.push({ id: id, name: name, role: role });
      toast(name + ' added as ' + role, 'ok'); render();
    },
    settings: function (f) {
      var name = val(f, 'name'), cur = val(f, 'currency'), dm = val(f, 'defaultMin'), tax = val(f, 'tax');
      if (!name) { return formError(f, 'Boutique name cannot be empty.'); }
      if (!cur) { return formError(f, 'Please enter a currency symbol.'); }
      if (!isInt(dm)) { return formError(f, 'Default minimum stock must be a whole number.'); }
      if (!isNum(tax) || Number(tax) < 0 || Number(tax) > 100) { return formError(f, 'Tax must be between 0 and 100.'); }
      S.settings.name = name; S.settings.currency = cur; S.settings.defaultMin = parseInt(dm, 10); S.settings.tax = Number(tax);
      toast('Settings saved', 'ok'); render();
    }
  };

  /* =====================================================================
     Events
     ===================================================================== */
  document.addEventListener('click', function (e) {
    var nav = e.target.closest('[data-nav]');
    if (nav) { go(nav.getAttribute('data-nav')); return; }
    var act = e.target.closest('[data-action]');
    if (act) {
      var fn = ACTIONS[act.getAttribute('data-action')];
      if (fn) { fn(act.getAttribute('data-id')); }
      return;
    }
    if (e.target === $('modal')) { closeModal(); }
  });

  document.addEventListener('submit', function (e) {
    var f = e.target.closest('form[data-form]');
    if (!f) { return; }
    e.preventDefault();
    clearError(f);
    FORMS[f.getAttribute('data-form')](f);
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'pq') { ui.q = t.value; $('ptable').innerHTML = productRows(); }
    else if (t.closest && t.closest('#saleForm')) { updatePreview(); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'ptype') { ui.type = t.value; $('ptable').innerHTML = productRows(); }
    else if (t.id === 'pstatus') { ui.status = t.value; $('ptable').innerHTML = productRows(); }
    else if (t.closest && t.closest('#saleForm')) { updatePreview(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeModal(); document.body.classList.remove('menu-open'); }
  });
  window.addEventListener('afterprint', function () { document.body.classList.remove('printing-bill'); });

  /* =====================================================================
     Start
     ===================================================================== */
  $('menuBtn').innerHTML = ic('menu');
  $('modalClose').innerHTML = ic('x');
  $('quickSale').innerHTML = ic('plus') + ' New sale';
  $('todayPill').textContent = new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  seed();
  render();
})();
</script>
</body>
</html>
